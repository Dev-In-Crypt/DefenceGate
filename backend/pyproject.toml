[project]
name = "dgate"
version = "0.1.0"
description = "EU Defence Access Portal, Phase 1 ingestion pipeline and API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # zoneinfo has no system tz database on Windows; PLACSP deadlines default
    # to Europe/Madrid, so this is a hard dependency, not a convenience.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "apscheduler>=3.10",
    # Use the OS certificate store: networks that terminate TLS with their
    # own CA otherwise look like an outage at the source.
    "truststore>=0.9",
    # Object storage for the raw payloads. The store has to be a separate
    # failure domain from the database, or it protects against a bad parser
    # and nothing else.
    "boto3>=1.34",
    # Parquet, for the one-off Polish historical backfill. The year files are a
    # sixth the size of the CSV copies and carry types, which is what makes a
    # schema change show up as a missing column rather than as silence.
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["dgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a live Postgres (DGATE_TEST_DSN). Excluded from the default gate; run with -m integration.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# "W" is here for W605, invalid escape sequence. A docstring describing a
# Windows path wrote \?\C: outside a raw string; Python reports that only as a
# DeprecationWarning buried in pytest output, so the gate stayed green and the
# daily audit is what noticed. Today it was a docstring. The same mistake in a
# regex is a silently wrong pattern.
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented idiom is a Depends() call in the argument default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
