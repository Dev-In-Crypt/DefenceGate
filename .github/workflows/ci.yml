name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dgate
          POSTGRES_PASSWORD: dgate
          POSTGRES_DB: dgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dgate -d dgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Lint
        run: python -m ruff check .
        working-directory: backend

      # Informational until the database layer is typed: mypy reports untyped
      # psycopg row access. Do not make this blocking by silencing it.
      - name: Types
        run: python -m mypy dgate || true
        working-directory: backend

      - name: Unit tests
        run: python -m pytest
        working-directory: backend

      - name: Integration tests
        run: python -m pytest -m integration
        working-directory: backend
        env:
          DGATE_TEST_DSN: postgresql://dgate:dgate@localhost:5432/dgate

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t dgate-backend:ci backend

      - name: Compose config is valid
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
