# Production topology: one host, five containers, no orchestrator.
#
#   caddy     TLS and reverse proxy
#   web       the frontend; profile `web`, image built by infra/build-web.sh
#   api       the serving layer
#   worker    scheduled ingestion; the process that must never fail silently
#   migrate   one-shot, applies migrations before api and worker start
#   postgres  the archive
#
# Run from the repository root:
#   docker compose -f infra/docker-compose.yml up -d --build

name: dgate

services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Kept in step with the client tools in the backend image: pg_dump 17 emits
    # SET transaction_timeout, which a 16 server rejects on restore, so a
    # mismatched pair produces backups that cannot be restored.
    image: postgres:17
    restart: unless-stopped
    # Memory for a 3.8 GB, 2-core host that also runs the worker (limit 2 GB, about 0.6 GB used),
    # the api and the web (512 MB each), and a 9.5 GB database (WP-72; the defaults were 128 MB
    # shared_buffers and 4 MB work_mem, QA audit of 21 October 2026, finding 6):
    #   shared_buffers 768MB        ~20 % of RAM: the hot set (opportunity 285 MB heap + 380 MB indexes,
    #                               organisation 260 MB) fits; more would leave too little to the OS
    #                               page cache and to the worker at its limit
    #   effective_cache_size 2GB    shared_buffers plus what the page cache usually holds (2.3 GB
    #                               buff/cache measured); a planner hint, allocates nothing
    #   work_mem 16MB               per sort or hash node; the API's 40-thread pool rarely runs more
    #                               than a few queries at once, so 16 MB x a few nodes x a few queries
    #   maintenance_work_mem 128MB  index builds (CONCURRENTLY) and VACUUM; autovacuum_work_mem 64MB
    #                               caps the three autovacuum workers at 192 MB together
    #   random_page_cost 1.1        the volume is SSD; 4 (the default) makes index walks look 4x dearer
    #   effective_io_concurrency 200  SSD: bitmap heap scans prefetch
    #   shared_preload_libraries=pg_stat_statements  so the remaining sequential scans can be attributed
    #                               (then: CREATE EXTENSION IF NOT EXISTS pg_stat_statements)
    # shm_size: parallel workers exchange data through /dev/shm, 64 MB by default in a container.
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-dgate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dgate} -d ${POSTGRES_DB:-dgate}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: ../backend
    command: ["python", "-m", "dgate.migrate"]
    environment:
      # The owner role. It runs migrations and nothing else; no running service
      # connects as it (docs/SECURITY_REVIEW_2026-10-12.md).
      DGATE_DSN: postgresql://${POSTGRES_USER:-dgate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dgate}
      # Logins for the least-privilege roles of migration 0024, applied after every
      # migrate, so rotating a value is a redeploy.
      DGATE_API_PASSWORD: ${DGATE_API_PASSWORD:?set DGATE_API_PASSWORD in infra/.env}
      DGATE_WORKER_PASSWORD: ${DGATE_WORKER_PASSWORD:?set DGATE_WORKER_PASSWORD in infra/.env}
      # The accounts role of migration 0027: the only one that may touch app_* tables.
      DGATE_APP_PASSWORD: ${DGATE_APP_PASSWORD:?set DGATE_APP_PASSWORD in infra/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: ../backend
    # --proxy-headers so the address the limiter sees is the client's, not Caddy's;
    # trusted from Caddy's own address on the `edge` network only (WP-71, QA M10): the
    # worker, the site's server and the migration job share the default network and can
    # reach this port, and with `*` any of them could claim to be 127.0.0.1.
    command: ["uvicorn", "dgate.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "10.250.71.2", "--no-server-header",
              # uvicorn's access line holds the client address (--proxy-headers) and the
              # query string, and container logs rotate by size only. The proxy's own
              # access log is the one request log, and it has a 14-day limit (logprune).
              "--no-access-log"]
    environment:
      # The API reads and nothing else: a role with SELECT, a 5 s statement budget
      # and 30 connections (migration 0024). Its own password, not the owner's.
      DGATE_DSN: postgresql://dgate_api:${DGATE_API_PASSWORD}@postgres:5432/${POSTGRES_DB:-dgate}
      # Accounts, reached only from the site's own server (docs/design/ACCOUNT_CONTRACT.md):
      # its own role, which can write app_* tables and nothing else.
      DGATE_APP_DSN: postgresql://dgate_app:${DGATE_APP_PASSWORD:?set DGATE_APP_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-dgate}
      # Shared with the site's server (`web`, DG_INTERNAL_SECRET): once it is set the account and
      # visit-counter routes refuse a call that does not carry it in `X-DG-Internal`. Required
      # (WP-71): compose refuses to start without it, and so does the API (DGATE_ENV below).
      DGATE_INTERNAL_SECRET: ${DGATE_INTERNAL_SECRET:?set DGATE_INTERNAL_SECRET in infra/.env}
      DGATE_ENV: production
      # Only the key of the sign-in throttle counters when DGATE_INTERNAL_SECRET is unset.
      DGATE_APP_PASSWORD: ${DGATE_APP_PASSWORD}
      # Mail for sign-in links. Without a relay sign-in stays closed; nothing is faked.
      DGATE_SMTP_HOST: ${DGATE_SMTP_HOST:-}
      DGATE_SMTP_PORT: ${DGATE_SMTP_PORT:-587}
      DGATE_SMTP_USER: ${DGATE_SMTP_USER:-}
      DGATE_SMTP_PASSWORD: ${DGATE_SMTP_PASSWORD:-}
      DGATE_SMTP_FROM: ${DGATE_SMTP_FROM:-}
      DGATE_SMTP_SECURITY: ${DGATE_SMTP_SECURITY:-starttls}
      DGATE_SITE_URL: https://${DGATE_DOMAIN:-localhost}
      DGATE_TELEGRAM_TOKEN: ${DGATE_TELEGRAM_TOKEN:-}
      DGATE_TELEGRAM_CHAT_ID: ${DGATE_TELEGRAM_CHAT_ID:-}
      # PLACSP winners on the supplier map (WP-60/61): an owner decision, off until `true` (docs/sources/es_placsp.md).
      DGATE_PLACSP_AWARDS_PUBLIC: ${DGATE_PLACSP_AWARDS_PUBLIC:-false}
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      default: {}
      # Caddy reaches the API as `api-edge`, a name that exists on this network only, so its
      # address as the API sees it is always 10.250.71.2, the one trusted for X-Forwarded-For.
      edge:
        aliases: [api-edge]
        # A fixed address too: started first, the API took .2 (Caddy's) automatically on 21 Oct 2026 and Caddy
        # could not start ("Address already in use").
        ipv4_address: 10.250.71.3

  worker:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: ../backend
    command: ["python", "-m", "dgate.worker"]
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Rows in, rows out; no DDL, no TRUNCATE, not a superuser (migration 0024).
      DGATE_DSN: postgresql://dgate_worker:${DGATE_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB:-dgate}
      # Alert digests are mailed from here; without a relay the job does nothing.
      DGATE_SMTP_HOST: ${DGATE_SMTP_HOST:-}
      DGATE_SMTP_PORT: ${DGATE_SMTP_PORT:-587}
      DGATE_SMTP_USER: ${DGATE_SMTP_USER:-}
      DGATE_SMTP_PASSWORD: ${DGATE_SMTP_PASSWORD:-}
      DGATE_SMTP_FROM: ${DGATE_SMTP_FROM:-}
      DGATE_SMTP_SECURITY: ${DGATE_SMTP_SECURITY:-starttls}
      DGATE_SITE_URL: https://${DGATE_DOMAIN:-localhost}
      # The language model is reached from the worker only (eligibility extraction).
      DGATE_OPENAI_API_KEY: ${DGATE_OPENAI_API_KEY:-}
      DGATE_OPENAI_MODEL: ${DGATE_OPENAI_MODEL:-}
      DGATE_LLM_MONTHLY_CAP_USD: ${DGATE_LLM_MONTHLY_CAP_USD:-5}
      # The monthly PLACSP archive catch-up of the award results (WP-61): off until `true`.
      DGATE_PLACSP_AWARDS_CATCHUP: ${DGATE_PLACSP_AWARDS_CATCHUP:-false}
      DGATE_RAW_BACKEND: ${DGATE_RAW_BACKEND:-fs}
      DGATE_RAW_DIR: /raw
      # The raw store is the thing the archive can be rebuilt from, so the
      # worker is the one process that must never be without credentials for
      # it. Left unset here it would fall back to the container's own disk and
      # keep reporting success, which is the failure that hides itself.
      DGATE_S3_ENDPOINT: ${DGATE_S3_ENDPOINT:-}
      DGATE_S3_BUCKET: ${DGATE_S3_BUCKET:-dgate-raw}
      DGATE_S3_REGION: ${DGATE_S3_REGION:-auto}
      DGATE_S3_ACCESS_KEY: ${DGATE_S3_ACCESS_KEY:-}
      DGATE_S3_SECRET_KEY: ${DGATE_S3_SECRET_KEY:-}
      # The `sftp` backend: a Hetzner Storage Box sub-account whose home is
      # this project's directory. The key and the host fingerprint are mounted
      # below, read-only; only their paths are settings.
      DGATE_SFTP_HOST: ${DGATE_SFTP_HOST:-}
      DGATE_SFTP_PORT: ${DGATE_SFTP_PORT:-23}
      DGATE_SFTP_USER: ${DGATE_SFTP_USER:-}
      DGATE_SFTP_ROOT: ${DGATE_SFTP_ROOT:-store}
      DGATE_SFTP_KEY_FILE: /run/secrets/box_key
      DGATE_SFTP_KNOWN_HOSTS: /run/secrets/known_hosts
      DGATE_BACKUP_DIR: /backups
      DGATE_BACKUP_PUBLIC_KEY: /run/secrets/backup_public.pem
      # Makes a missing key a loud failure rather than a plaintext dump.
      DGATE_ENV: production
      DGATE_BACKUP_KEEP_DAYS: ${DGATE_BACKUP_KEEP_DAYS:-30}
      DGATE_BACKUP_KEEP_DAYS_LOCAL: ${DGATE_BACKUP_KEEP_DAYS_LOCAL:-7}
      # Where the Atlas Przetargow year files land for the one-off Polish
      # backfill. Its own volume so an interrupted multi-hour run does not
      # re-download hundreds of megabytes on every retry.
      DGATE_ATLAS_DIR: /data/atlas
      # Year files the worker finishes loading by itself, e.g. "2024,2025".
      # Empty by default: a multi-hour history load should be chosen, not
      # inherited. Once a year's .done marker exists it is skipped for good.
      DGATE_ATLAS_BACKFILL_YEARS: ${DGATE_ATLAS_BACKFILL_YEARS:-}
      DGATE_ATLAS_WRITE_WORKERS: ${DGATE_ATLAS_WRITE_WORKERS:-64}
      # The TED history load, 2017 to yesterday. Empty means off; set a start
      # date and the worker resumes it in the background on every start until
      # every day is marked done.
      DGATE_TED_HISTORY_FROM: ${DGATE_TED_HISTORY_FROM:-}
      DGATE_TED_HISTORY_TO: ${DGATE_TED_HISTORY_TO:-}
      # Cover whatever was missed while this container was down. See
      # docs/RUNBOOK.md, "Missed days".
      DGATE_CATCH_UP: ${DGATE_CATCH_UP:-1}
      DGATE_CATCH_UP_MAX_DAYS: ${DGATE_CATCH_UP_MAX_DAYS:-7}
      # Alerting. Unset means log-only; see dgate/ops/notify.py.
      DGATE_HEALTHCHECKS_BASE: ${DGATE_HEALTHCHECKS_BASE:-}
      DGATE_TELEGRAM_TOKEN: ${DGATE_TELEGRAM_TOKEN:-}
      DGATE_TELEGRAM_CHAT_ID: ${DGATE_TELEGRAM_CHAT_ID:-}
    volumes:
      - raw:/raw
      - backups:/backups
      - atlas:/data/atlas
      # Not in the repository: infra/secrets/ is gitignored. The key is owned by
      # the container's uid (10001) and readable by nobody else.
      - ./secrets/storagebox_ed25519:/run/secrets/box_key:ro
      - ./secrets/known_hosts:/run/secrets/known_hosts:ro
      # The PUBLIC half of the backup key. The private half is never on this host
      # or on the Storage Box: it is how a dump becomes unreadable to anyone who
      # reaches either one (infra/secrets/ is gitignored).
      - ./secrets/backup-public.pem:/run/secrets/backup_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The frontend. Behind the `web` profile, so a plain `up -d` neither builds nor starts
  # it: it needs the domain and an image from infra/build-web.sh. Never published;
  # only Caddy reaches it, on the compose network.
  web:
    profiles: ["web"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    build:
      context: ../web
    image: dgate-web:local
    environment:
      DG_API_URL: http://api:8000
      # The same value as the API's DGATE_INTERNAL_SECRET. Server-side only: it is read by the
      # account module and the middleware and never reaches a browser.
      DG_INTERNAL_SECRET: ${DGATE_INTERNAL_SECRET:?set DGATE_INTERNAL_SECRET in infra/.env}
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DGATE_DOMAIN: ${DGATE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
      - caddylogs:/var/log/caddy
    depends_on:
      - api
    networks:
      default: {}
      edge:
        ipv4_address: 10.250.71.2

  # Keeps the proxy's request logs to 14 days (Privacy notice, section 2): cuts old lines
  # from the active files and deletes rolled ones, hourly. It reads only each line's
  # timestamp. Root inside the container so it can rewrite Caddy's files; no capabilities
  # and no network.
  logprune:
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    build:
      context: ../backend
    user: "0:0"
    command: ["python", "-m", "dgate.ops.logprune", "--dir", "/logs", "--days", "14",
              "--every", "3600"]
    volumes:
      - caddylogs:/logs
    network_mode: none
    mem_limit: 128m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    restart: unless-stopped

# The proxy and the API only (WP-71, QA M10). A fixed subnet so Caddy has a fixed address the API
# trusts for X-Forwarded-For; 10.250.71.0/29 is outside Docker's default pools and the host's routes.
networks:
  edge:
    ipam:
      config:
        - subnet: 10.250.71.0/29

volumes:
  atlas:
  pgdata:
  raw:
  backups:
  caddydata:
  caddyconfig:
  caddylogs:
